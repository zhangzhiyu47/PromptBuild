name: Build

on:
  push:

jobs:
  build-musl:
    name: Build Static MUSL ${{ matrix.arch_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch_name: amd64
          - target: aarch64-unknown-linux-musl
            arch_name: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Build release with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/prompt" \
             "dist/prompt-${{ matrix.arch_name }}-linux-musl"
          chmod +x "dist/prompt-${{ matrix.arch_name }}-linux-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-${{ matrix.arch_name }}-linux-musl
          path: dist/prompt-${{ matrix.arch_name }}-linux-musl
          if-no-files-found: error

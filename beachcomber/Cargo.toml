[package]
name = "beachcomber"
version = "0.9.1"
edition = "2024"

[lib]
name = "beachcomber"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
notify = "8"
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

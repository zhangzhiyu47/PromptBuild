[package]
name = "prompt"
version = "0.1.0"
edition = "2024"

[dependencies]
unicode-width = "0.1"
terminal_size = "0.4"
argh = "0.1"
nix = { version = "0.27", features = ["user", "signal", "hostname", "fs"] }
tokio = { version = "1", features = ["full"] }
moka = { version = "0.12", features = ["sync"] }
notify = "6"
notify-debouncer-mini = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
